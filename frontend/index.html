<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BookingMx</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="header">
    <div class="header-content">
      <h1>BookingMx</h1>
      <p>Nearby Cities Graph & Reservation Management Demo</p>
    </div>
  </header>

  <main class="container">

    <!-- Nearby Cities Search -->
    <section class="card glass">
      <h2 class="section-title">Nearby Cities Graph</h2>

      <form id="graph-form" class="form">
        <div class="form-group">
          <label>Destination</label>
          <input id="destination" type="text" placeholder="e.g., Guadalajara" required />
        </div>

        <div class="form-group">
          <label>Max Distance (km)</label>
          <input id="maxDistance" type="number" min="0" step="1" value="250" />
        </div>

        <button class="btn primary" type="submit">Find Nearby</button>
      </form>

      <div id="graph-output" class="sub-card">
        <h3 class="sub-title">Results</h3>
        <ul id="nearby-list"></ul>
      </div>
    </section>

    <!-- Reservations -->
    <section class="card glass">
      <h2 class="section-title">Reservations</h2>

      <form id="reservation-form" class="form">
        <div class="form-group">
          <label>Guest Name</label>
          <input id="guestName" required />
        </div>

        <div class="form-group">
          <label>Hotel Name</label>
          <input id="hotelName" required />
        </div>

        <div class="form-group">
          <label>Check-in</label>
          <input id="checkIn" type="date" required />
        </div>

        <div class="form-group">
          <label>Check-out</label>
          <input id="checkOut" type="date" required />
        </div>

        <button class="btn primary" type="submit">Create Reservation</button>
      </form>

      <div class="sub-card">
        <div class="sub-header">
          <h3 class="sub-title">All Reservations</h3>
          <button id="refresh" class="btn secondary small">Refresh</button>
        </div>

        <ul id="reservation-list"></ul>
      </div>
    </section>

  </main>

  <footer class="footer">
    <small>© 2025 BookingMx</small>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
